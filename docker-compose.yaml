version: "3.8"

services:
  arxiv_parser:
    build: .
    container_name: arxiv_parser
    ports:
      - "${FLASK_PORT:-5000}:5000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - DEFAULT_MODEL=${DEFAULT_MODEL}
      - FLASK_PORT=5000
      - TZ=Asia/Shanghai
    volumes:
      - ./:/app
    restart: unless-stopped

